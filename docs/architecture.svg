<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1240" height="900" fill="#ffffff"/>
  <text x="36" y="34" font-size="20" font-weight="700" fill="#16191f">CivicFlow AI — Multimodal Community Issue-to-Action Platform</text>
  <text x="36" y="55" font-size="12.5" fill="#5a6b7b">Serverless on AWS · us-east-1 · "CivicFlow doesn't count complaints. It understands the problem behind them."</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#45586b"/>
    </marker>
  </defs>

  <!-- number badge helper is inlined per node -->

  <!-- Citizens -->
  <g>
    <rect x="36" y="360" width="104" height="64" rx="8" fill="#232f3e"/>
    <text x="88" y="388" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Citizens</text>
    <text x="88" y="406" text-anchor="middle" font-size="10" fill="#cfd8e3">text / image / both</text>
  </g>

  <!-- AWS Cloud boundary -->
  <rect x="170" y="80" width="1040" height="560" rx="10" fill="none" stroke="#232f3e" stroke-width="2"/>
  <rect x="178" y="88" width="20" height="20" rx="3" fill="#232f3e"/>
  <text x="206" y="103" font-size="13" font-weight="700" fill="#232f3e">AWS Cloud · us-east-1</text>

  <!-- Compute group -->
  <rect x="430" y="150" width="300" height="300" rx="8" fill="none" stroke="#7d8998" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="444" y="170" font-size="12" font-weight="700" fill="#7d8998">Compute · AWS Lambda</text>

  <!-- 1 CloudFront -->
  <g>
    <rect x="210" y="190" width="150" height="60" rx="8" fill="#f2e6ec" stroke="#bc1356" stroke-width="2"/>
    <rect x="210" y="190" width="8" height="60" rx="4" fill="#bc1356"/>
    <text x="292" y="214" text-anchor="middle" font-size="11.5" font-weight="700" fill="#16191f">Amazon CloudFront</text>
    <text x="292" y="231" text-anchor="middle" font-size="10" fill="#5a6b7b">public HTTPS · OAC</text>
    <rect x="344" y="182" width="20" height="20" rx="3" fill="#2d72d9"/>
    <text x="354" y="197" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  </g>
  <!-- 2 S3 site -->
  <g>
    <rect x="210" y="300" width="150" height="60" rx="8" fill="#e6f0e3" stroke="#277116" stroke-width="2"/>
    <rect x="210" y="300" width="8" height="60" rx="4" fill="#277116"/>
    <text x="292" y="324" text-anchor="middle" font-size="11.5" font-weight="700" fill="#16191f">Amazon S3</text>
    <text x="292" y="341" text-anchor="middle" font-size="10" fill="#5a6b7b">React SPA (static site)</text>
    <rect x="344" y="292" width="20" height="20" rx="3" fill="#2d72d9"/>
    <text x="354" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  </g>
  <!-- 3 API Gateway -->
  <g>
    <rect x="430" y="470" width="160" height="60" rx="8" fill="#f6e3ec" stroke="#b0084d" stroke-width="2"/>
    <rect x="430" y="470" width="8" height="60" rx="4" fill="#b0084d"/>
    <text x="518" y="494" text-anchor="middle" font-size="11.5" font-weight="700" fill="#16191f">Amazon API Gateway</text>
    <text x="518" y="511" text-anchor="middle" font-size="10" fill="#5a6b7b">HTTP API</text>
    <rect x="574" y="462" width="20" height="20" rx="3" fill="#2d72d9"/>
    <text x="584" y="477" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  </g>
  <!-- 4 API Lambda -->
  <g>
    <rect x="450" y="190" width="260" height="76" rx="8" fill="#fdeadb" stroke="#d05c17" stroke-width="2"/>
    <rect x="450" y="190" width="8" height="76" rx="4" fill="#d05c17"/>
    <text x="584" y="213" text-anchor="middle" font-size="11.5" font-weight="700" fill="#16191f">API Lambda · Node 22 / TS</text>
    <text x="584" y="231" text-anchor="middle" font-size="10" fill="#5a6b7b">reports · analyze · issues</text>
    <text x="584" y="247" text-anchor="middle" font-size="10" fill="#5a6b7b">dashboard · presign</text>
    <rect x="694" y="182" width="20" height="20" rx="3" fill="#2d72d9"/>
    <text x="704" y="197" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
  </g>
  <!-- 5 Strands agent Lambda -->
  <g>
    <rect x="450" y="300" width="260" height="90" rx="8" fill="#fdeadb" stroke="#d05c17" stroke-width="2"/>
    <rect x="450" y="300" width="8" height="90" rx="4" fill="#d05c17"/>
    <text x="584" y="324" text-anchor="middle" font-size="11.5" font-weight="700" fill="#16191f">Ask Agent Lambda · Python 3.12</text>
    <text x="584" y="342" text-anchor="middle" font-size="10" fill="#5a6b7b">AWS Strands Agents SDK</text>
    <text x="584" y="358" text-anchor="middle" font-size="10" fill="#5a6b7b">tool-using agent (POST /ask)</text>
    <rect x="694" y="292" width="20" height="20" rx="3" fill="#2d72d9"/>
    <text x="704" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>
  </g>

  <!-- 6 DynamoDB -->
  <g>
    <rect x="850" y="150" width="170" height="56" rx="8" fill="#e4e6f7" stroke="#3334b9" stroke-width="2"/>
    <rect x="850" y="150" width="8" height="56" rx="4" fill="#3334b9"/>
    <text x="938" y="173" text-anchor="middle" font-size="11.5" font-weight="700" fill="#16191f">Amazon DynamoDB</text>
    <text x="938" y="190" text-anchor="middle" font-size="10" fill="#5a6b7b">single table + GSIs</text>
    <rect x="1004" y="142" width="20" height="20" rx="3" fill="#2d72d9"/>
    <text x="1014" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6</text>
  </g>
  <!-- 7 S3 images -->
  <g>
    <rect x="850" y="228" width="170" height="56" rx="8" fill="#e6f0e3" stroke="#277116" stroke-width="2"/>
    <rect x="850" y="228" width="8" height="56" rx="4" fill="#277116"/>
    <text x="938" y="251" text-anchor="middle" font-size="11.5" font-weight="700" fill="#16191f">Amazon S3</text>
    <text x="938" y="268" text-anchor="middle" font-size="10" fill="#5a6b7b">citizen images (presigned)</text>
    <rect x="1004" y="220" width="20" height="20" rx="3" fill="#2d72d9"/>
    <text x="1014" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">7</text>
  </g>
  <!-- 8 Rekognition -->
  <g>
    <rect x="850" y="306" width="170" height="56" rx="8" fill="#e4e6f7" stroke="#3334b9" stroke-width="2"/>
    <rect x="850" y="306" width="8" height="56" rx="4" fill="#3334b9"/>
    <text x="938" y="329" text-anchor="middle" font-size="11.5" font-weight="700" fill="#16191f">Amazon Rekognition</text>
    <text x="938" y="346" text-anchor="middle" font-size="10" fill="#5a6b7b">DetectLabels</text>
    <rect x="1004" y="298" width="20" height="20" rx="3" fill="#2d72d9"/>
    <text x="1014" y="313" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">8</text>
  </g>
  <!-- 9 Bedrock -->
  <g>
    <rect x="850" y="384" width="170" height="56" rx="8" fill="#e4e6f7" stroke="#3334b9" stroke-width="2"/>
    <rect x="850" y="384" width="8" height="56" rx="4" fill="#3334b9"/>
    <text x="938" y="407" text-anchor="middle" font-size="11.5" font-weight="700" fill="#16191f">Amazon Bedrock</text>
    <text x="938" y="424" text-anchor="middle" font-size="10" fill="#5a6b7b">Amazon Nova</text>
    <rect x="1004" y="376" width="20" height="20" rx="3" fill="#2d72d9"/>
    <text x="1014" y="391" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">9</text>
  </g>
  <!-- 10 CloudWatch -->
  <g>
    <rect x="210" y="470" width="170" height="56" rx="8" fill="#f6e3ec" stroke="#b0084d" stroke-width="2"/>
    <rect x="210" y="470" width="8" height="56" rx="4" fill="#b0084d"/>
    <text x="300" y="493" text-anchor="middle" font-size="11.5" font-weight="700" fill="#16191f">Amazon CloudWatch</text>
    <text x="300" y="510" text-anchor="middle" font-size="10" fill="#5a6b7b">structured logs</text>
    <rect x="360" y="462" width="24" height="20" rx="3" fill="#2d72d9"/>
    <text x="372" y="477" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">10</text>
  </g>
  <!-- IAM -->
  <g>
    <rect x="210" y="556" width="170" height="52" rx="8" fill="#f6e3ec" stroke="#b0084d" stroke-width="2"/>
    <rect x="210" y="556" width="8" height="52" rx="4" fill="#b0084d"/>
    <text x="300" y="578" text-anchor="middle" font-size="11.5" font-weight="700" fill="#16191f">AWS IAM</text>
    <text x="300" y="595" text-anchor="middle" font-size="10" fill="#5a6b7b">least-privilege roles</text>
  </g>

  <!-- arrows -->
  <!-- Entry flow (solid dark) -->
  <g stroke="#45586b" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M140,388 L208,220"/>
    <path d="M300,250 Q300,420 428,492"/>
    <path d="M560,470 L578,268"/>
  </g>
  <!-- CloudFront -> S3 static (green dashed) -->
  <path d="M285,250 L285,298" stroke="#277116" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <!-- API Gateway -> Agent Lambda (orange) -->
  <path d="M560,500 Q584,460 584,392" stroke="#d05c17" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- API Lambda (4) -> data/AI services. All SOLID, all start at the API Lambda right edge x=710. -->
  <g stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M710,205 L848,172" stroke="#3334b9"/>            <!-- DynamoDB read/write -->
    <path d="M710,222 L848,250" stroke="#277116"/>            <!-- S3 images presigned PUT -->
    <path d="M710,240 L848,328" stroke="#3334b9"/>            <!-- Rekognition DetectLabels -->
    <path d="M710,256 L848,404" stroke="#3334b9"/>            <!-- Bedrock Converse -->
  </g>
  <!-- API Lambda (4) -> CloudWatch logs (pink dashed), down-left -->
  <path d="M470,250 Q400,470 384,478" stroke="#b0084d" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)"/>

  <!-- Agent Lambda (5) -> services. DASHED, start at agent right edge x=710, y>=335 so they read as the agent's. -->
  <g stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)">
    <path d="M710,335 Q800,320 848,190" stroke="#3334b9"/>    <!-- Agent read (tools) DynamoDB -->
    <path d="M710,360 Q790,420 848,418" stroke="#3334b9"/>    <!-- Agent reasoning Bedrock -->
    <path d="M560,390 Q440,470 384,486" stroke="#b0084d"/>    <!-- Agent logs CloudWatch -->
  </g>

  <g font-size="9.5" fill="#45586b">
    <text x="150" y="300">HTTPS</text>
    <text x="305" y="400">REST</text>
    <text x="596" y="360" fill="#d05c17">POST /ask</text>
  </g>
  <!-- Labels tied to API Lambda (4) arrows -->
  <g font-size="9.5" font-weight="700">
    <text x="716" y="188" fill="#3334b9">read / write (4)</text>
    <text x="716" y="236" fill="#277116">presigned PUT (4)</text>
    <text x="716" y="300" fill="#3334b9">DetectLabels (4)</text>
    <text x="716" y="276" fill="#3334b9">Converse text+image (4)</text>
  </g>
  <!-- Labels tied to Agent Lambda (5) arrows -->
  <g font-size="9" fill="#3334b9" font-style="italic">
    <text x="724" y="338">read tools (5)</text>
    <text x="724" y="372">agent reasoning (5)</text>
  </g>

  <!-- Legend -->
  <rect x="36" y="660" width="1174" height="214" rx="8" fill="#f2f3f3" stroke="#d5dbdb"/>
  <text x="52" y="684" font-size="14" font-weight="700" fill="#16191f">How it works — follow the numbers</text>
  <g font-size="11.5" fill="#16191f">
    <text x="52" y="708">1  A citizen opens the app via Amazon CloudFront (public HTTPS; private buckets via OAC).</text>
    <text x="52" y="728">2  The React single-page app is served from a private Amazon S3 bucket.</text>
    <text x="52" y="748">3  The browser calls the REST API on Amazon API Gateway (HTTP API).</text>
    <text x="52" y="768">4  Most routes run on the API Lambda (Node 22): report, analyze, issues, dashboard, presign.</text>
    <text x="52" y="788">5  POST /ask runs the Ask Agent Lambda (Python) on the AWS Strands Agents SDK — a tool-using agent.</text>
    <text x="636" y="708">6  Reports and clustered issues are stored in Amazon DynamoDB (single table + GSIs).</text>
    <text x="636" y="728">7  Citizen photos upload straight to Amazon S3 via a presigned PUT URL.</text>
    <text x="636" y="748">8  Amazon Rekognition extracts visual evidence (DetectLabels) from the photo.</text>
    <text x="636" y="768">9  Amazon Bedrock (Nova) fuses text + image + context into a structured assessment; powers the agent.</text>
    <text x="636" y="788">10 Lambdas log to Amazon CloudWatch; AWS IAM grants least-privilege roles throughout.</text>
  </g>
  <text x="52" y="820" font-size="11.5" font-weight="700" fill="#16191f">Pipeline</text>
  <text x="52" y="840" font-size="11.5" fill="#45586b">evidence extraction (text + Rekognition) → fusion (Bedrock Nova) → structured output → duplicate detection → issue clustering → transparent priority → recommended action → dashboard</text>
  <text x="52" y="862" font-size="10.5" fill="#7d4b00">Note: Rekognition (8) is called only by the API Lambda (4) during analysis — not by the Agent (5). Both Lambdas call Bedrock (9): the API Lambda for multimodal reasoning, the Agent for data-grounded Q&amp;A.</text>
</svg>
